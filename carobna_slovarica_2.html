<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Čarobna slovarica 2 — Pustolovina</title><style>
*{box-sizing:border-box}body{margin:0;background:#15263b;color:#fff;font-family:system-ui,Arial}#wrap{max-width:1100px;margin:auto;padding:12px}header{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}h1{font-size:clamp(19px,3vw,29px);margin:6px 0}button{cursor:pointer;border:0;border-radius:12px;padding:11px 15px;font-weight:800;font-size:16px;background:#ffe082;color:#29364b}button:hover{filter:brightness(1.06)}button:focus-visible{outline:3px solid #fff}.hud{display:flex;gap:12px;flex-wrap:wrap;background:#263b54;padding:9px 14px;border-radius:12px}canvas{display:block;width:100%;height:auto;border:4px solid #8edbc2;border-radius:18px;background:#bdeeff;touch-action:none}.controls{display:flex;gap:8px;justify-content:center;margin:12px 0}.controls button{min-width:64px;font-size:24px}.hint{color:#d6e8ef;text-align:center;font-size:14px}#modal{position:fixed;inset:0;background:#091526c9;display:none;align-items:center;justify-content:center;padding:18px;z-index:3}#modal.show{display:flex}.panel{background:#fff;color:#243448;border-radius:24px;padding:25px;max-width:530px;width:100%;box-shadow:0 20px 80px #0007;text-align:center}.panel h2{margin:0 0 10px;font-size:28px}.panel p{line-height:1.45}.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:20px}.choices button{background:#c7f2e2;font-size:24px}.choices button:disabled{opacity:.6}.small{font-size:13px;color:#566}.toast{min-height:26px;text-align:center;color:#fff2aa;font-weight:700}@media(max-width:500px){.controls button{min-width:55px}.panel{padding:18px}.choices button{font-size:20px}}
</style></head><body><div id="wrap"><header><h1>🌟 Čarobna slovarica 2</h1><button id="reset">Nova igra</button></header><div class="hud"><span id="level">🌳 Svijet 1</span><span id="stars">⭐ 0</span><span id="hearts">❤️❤️❤️</span><span id="progress">🗝️ 0/3</span></div><canvas id="game" width="960" height="540" aria-label="Igra: pomiči lika strelicama ili tipkama WASD"></canvas><div class="controls"><button data-dir="left" aria-label="Lijevo">⬅️</button><button data-dir="up" aria-label="Gore">⬆️</button><button data-dir="down" aria-label="Dolje">⬇️</button><button data-dir="right" aria-label="Desno">➡️</button></div><div class="toast" id="toast">Sakupi tri ključa rješavanjem zadataka, pa pronađi vrata!</div><p class="hint">Tipkovnica: ← ↑ ↓ → ili WASD · Na mobitelu: gumbi · Dodirni zadatak kad mu priđeš · Napredak se sprema automatski.</p></div><div id="modal" role="dialog" aria-modal="true"><div class="panel"><h2 id="mt"></h2><p id="mq"></p><div class="choices" id="choices"></div><p id="feedback" aria-live="polite"></p><p class="small" id="extra"></p></div></div><script>
(()=>{'use strict';
const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);
const words=['MAČKA','SUNCE','RIBA','KUĆA','LOPTA','ZEC','MEDO','ŠUMA','VODA','CVJET','PTICA','JABUKA','OBLAK','BROD','KAPA','RUKA','NOGA','KONJ','PAS','MORE'];
const stages=[{name:'Čarobna šuma',base:'#8ed9a2',dark:'#4b9a70'},{name:'Sunčana livada',base:'#e3e99a',dark:'#9aba63'},{name:'Dvorac znanja',base:'#d4b8ee',dark:'#9271b7'}];
let state={world:0,stars:0,hearts:3},player={x:75,y:270},keys={},busy=false,task=null,invuln=0,last=0,frame=0,objects=[],particles=[],cooldown=0;
try{let s=JSON.parse(localStorage.getItem('slovarica2'));if(s&&Number.isInteger(s.world)){state={world:Math.min(2,Math.max(0,s.world)),stars:Math.max(0,s.stars||0),hearts:Math.max(1,Math.min(3,s.hearts||3))}}}catch(e){}
const save=()=>{try{localStorage.setItem('slovarica2',JSON.stringify(state))}catch(e){}};
const rnd=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>[...a].sort(()=>Math.random()-.5);
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function build(){player.x=75;player.y=270;objects=[];particles=[];busy=false;task=null;let spots=[[210,140],[370,380],[525,150],[690,360],[780,130],[360,120],[610,260]];spots.forEach((p,i)=>{if(i<5)objects.push({x:p[0],y:p[1],type:'task',done:false,id:i});else objects.push({x:p[0],y:p[1],type:'gem',done:false,id:i})});objects.push({x:890,y:265,type:'door'});for(let i=0;i<3;i++)objects.push({x:250+i*230,y:260+(i%2)*70,type:'slime',offset:i*1.8});update();}
function update(){let n=objects.filter(o=>o.type==='task'&&o.done).length;$('level').textContent=`🌍 ${state.world+1}/3 ${stages[state.world].name}`;$('stars').textContent='⭐ '+state.stars;$('hearts').textContent='❤️'.repeat(state.hearts);$('progress').textContent='🗝️ '+n+'/3';save()}
function toast(s){$('toast').textContent=s}
function show(title,q,answers,correct,done,extra=''){busy=true;keys={};$('modal').classList.add('show');$('mt').textContent=title;$('mq').textContent=q;$('extra').textContent=extra;$('feedback').textContent='';let el=$('choices');el.replaceChildren();answers.forEach(a=>{let b=document.createElement('button');b.textContent=a;b.onclick=()=>{if(a===correct){$('feedback').textContent='🎉 Točno!';el.querySelectorAll('button').forEach(x=>x.disabled=true);setTimeout(()=>{$('modal').classList.remove('show');busy=false;done();update()},650)}else{$('feedback').textContent='Pokušaj ponovno! 💛';b.disabled=true}};el.append(b)})}
function makeQuestion(o){let mode=(o.id+state.world)%3;if(mode===0){let w=words[(o.id*3+state.world*6+rnd(0,4))%words.length],ix=rnd(0,w.length-1),right=w[ix],wrong=shuffle('ABCDEFGHIJKLMNOPQRSTUVWXYZČĆĐŠŽ'.split('').filter(x=>x!==right)).slice(0,3);show('🔤 Pronađi slovo',w.slice(0,ix)+' _ '+w.slice(ix+1),shuffle([...wrong,right]),right,()=>reward(o),'Koje slovo nedostaje?')}else if(mode===1){let w=words[(o.id*4+state.world*5+rnd(0,3))%words.length];let answers=shuffle([w,...shuffle(words.filter(x=>x!==w&&Math.abs(x.length-w.length)<=1)).slice(0,3)]);show('📖 Prepoznaj riječ','Koja riječ odgovara slovima: '+w.split('').join(' · ')+'?',answers,w,()=>reward(o))}else{let a=rnd(1,9),b=rnd(1,9),minus=Math.random()<.5;if(minus&&b>a)[a,b]=[b,a];if(!minus&&a+b>10)b=10-a;let result=minus?a-b:a+b,answers=new Set([result]);while(answers.size<4)answers.add(rnd(0,10));show('🔢 Matematički izazov',`${a} ${minus?'−':'+'} ${b} = ?`,shuffle([...answers].map(String)),String(result),()=>reward(o))}}
function reward(o){o.done=true;state.stars+=10;for(let i=0;i<22;i++)particles.push({x:o.x,y:o.y,vx:(Math.random()-.5)*7,vy:(Math.random()-.5)*7,life:55});toast('Bravo! +10 zvjezdica. Sakupi tri ključa i dođi do vrata!')}
function door(){let n=objects.filter(o=>o.type==='task'&&o.done).length;if(n<3){toast(`Trebaš još ${3-n} riješena zadatka za vrata!`);cooldown=80;return}if(state.world===2){show('🏆 Pobjeda!','Osvojio/la si sva tri svijeta! Želiš novu pustolovinu?',['IGRAJ PONOVNO'], 'IGRAJ PONOVNO',()=>{state={world:0,stars:0,hearts:3};build()})}else{show('🚪 Svijet otključan!','Sjajno! Nastavi u sljedeći svijet.',['NASTAVI'],'NASTAVI',()=>{state.world++;state.hearts=3;build()})}}
function hurt(){if(invuln>0)return;state.hearts--;invuln=90;toast('Uh, pazi na nestašne oblake!');if(state.hearts<=0){show('💖 Novi pokušaj','Nema više srca, ali zvjezdice ostaju!',['POKUŠAJ PONOVNO'],'POKUŠAJ PONOVNO',()=>{state.hearts=3;build()})}update()}
function draw(){frame++;let s=stages[state.world];let grad=ctx.createLinearGradient(0,0,0,540);grad.addColorStop(0,'#bfeeff');grad.addColorStop(.63,'#e7f9ff');grad.addColorStop(.64,s.base);grad.addColorStop(1,s.dark);ctx.fillStyle=grad;ctx.fillRect(0,0,960,540);
ctx.fillStyle='#fff9b1';ctx.beginPath();ctx.arc(840,78,43,0,7);ctx.fill();
for(let i=0;i<7;i++){let x=(i*173+30+frame*.12)%1150-80,y=45+(i%3)*35;ctx.fillStyle='#fff';for(let j=0;j<3;j++){ctx.beginPath();ctx.ellipse(x+j*23,y+(j%2)*-10,30,17,0,0,7);ctx.fill()}}
ctx.fillStyle='#e8ce91';ctx.beginPath();ctx.ellipse(480,310,500,66,0,0,7);ctx.fill();
for(let i=0;i<20;i++){let x=(i*97+39)%950,y=390+(i*41)%130;ctx.fillStyle=i%2?'#ffdf74':'#ff9cb7';ctx.beginPath();ctx.arc(x,y,5,0,7);ctx.fill();ctx.fillStyle='#4d965d';ctx.fillRect(x-1,y+4,2,12)}
for(let o of objects){if(o.done)continue;let bob=Math.sin(frame*.055+o.x)*5;ctx.save();ctx.translate(o.x,o.y+bob);if(o.type==='task'){ctx.fillStyle='#fff';ctx.strokeStyle='#4c7ca0';ctx.lineWidth=4;ctx.beginPath();ctx.roundRect(-31,-32,62,64,13);ctx.fill();ctx.stroke();ctx.fillStyle='#376e9e';ctx.font='bold 34px system-ui';ctx.textAlign='center';ctx.fillText('?',0,12)}else if(o.type==='gem'){ctx.fillStyle='#fff176';ctx.font='42px system-ui';ctx.textAlign='center';ctx.fillText('⭐',0,14)}else if(o.type==='door'){ctx.fillStyle='#6947a8';ctx.beginPath();ctx.roundRect(-35,-67,70,110,[32,32,4,4]);ctx.fill();ctx.fillStyle='#e7ccff';ctx.font='36px system-ui';ctx.textAlign='center';ctx.fillText('🚪',0,9)}else if(o.type==='slime'){ctx.fillStyle='#a66bd3';ctx.beginPath();ctx.ellipse(0,0,29,22,0,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-10,-5,6,0,7);ctx.arc(10,-5,6,0,7);ctx.fill();ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-10,-5,3,0,7);ctx.arc(10,-5,3,0,7);ctx.fill()}ctx.restore()}
ctx.save();ctx.translate(player.x,player.y+Math.sin(frame*.1)*3);if(invuln&&frame%8<4)ctx.globalAlpha=.35;ctx.fillStyle='#8d8f96';ctx.beginPath();ctx.ellipse(-15,-32,11,38,-.17,0,7);ctx.ellipse(15,-32,11,38,.17,0,7);ctx.fill();ctx.fillStyle='#f3b3c4';ctx.beginPath();ctx.ellipse(-15,-32,5,26,-.17,0,7);ctx.ellipse(15,-32,5,26,.17,0,7);ctx.fill();ctx.fillStyle='#aeb1b9';ctx.beginPath();ctx.arc(0,0,29,0,7);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(-10,-5,7,0,7);ctx.arc(10,-5,7,0,7);ctx.fill();ctx.fillStyle='#1d2934';ctx.beginPath();ctx.arc(-10,-5,3,0,7);ctx.arc(10,-5,3,0,7);ctx.fill();ctx.fillStyle='#ed879c';ctx.beginPath();ctx.arc(0,9,5,0,7);ctx.fill();ctx.restore();
particles=particles.filter(p=>p.life-->0);for(let p of particles){p.x+=p.vx;p.y+=p.vy;ctx.globalAlpha=p.life/55;ctx.fillStyle='#fff2a0';ctx.fillRect(p.x,p.y,6,6)}ctx.globalAlpha=1}
function tick(t){let dt=Math.min(2,(t-last)/16.67||1);last=t;if(!busy){let dx=(keys.right?1:0)-(keys.left?1:0),dy=(keys.down?1:0)-(keys.up?1:0),len=Math.hypot(dx,dy)||1;player.x=Math.max(34,Math.min(925,player.x+dx/len*4*dt));player.y=Math.max(85,Math.min(490,player.y+dy/len*4*dt));if(invuln>0)invuln-=dt;if(cooldown>0)cooldown-=dt;for(let o of objects){if(o.done)continue;if(o.type==='slime'){o.y+=Math.sin(frame*.035+o.offset)*.9*dt;if(dist(player,o)<43)hurt()}else if(dist(player,o)<56&&cooldown<=0){cooldown=65;if(o.type==='task')makeQuestion(o);else if(o.type==='door')door();else if(o.type==='gem'){o.done=true;state.stars+=5;toast('⭐ Bonus +5!');update()}}}}draw();requestAnimationFrame(tick)}
function setDir(dir,on){keys[dir]=on}const map={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};document.addEventListener('keydown',e=>{let d=map[e.key];if(d){e.preventDefault();setDir(d,true)}});document.addEventListener('keyup',e=>{let d=map[e.key];if(d)setDir(d,false)});document.querySelectorAll('[data-dir]').forEach(b=>{let d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();b.setPointerCapture(e.pointerId);setDir(d,true)});for(let ev of ['pointerup','pointercancel','lostpointercapture'])b.addEventListener(ev,()=>setDir(d,false))});$('reset').onclick=()=>{if(confirm('Započeti novu igru od početka?')){state={world:0,stars:0,hearts:3};build();$('modal').classList.remove('show')}};build();requestAnimationFrame(tick);
})();
</script></body></html>

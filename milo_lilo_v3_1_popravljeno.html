</style></head><body><canvas id="game"></canvas><div id="hud"><div id="status" class="glass"><div id="zone">🌴 SMARAGDNA OBALA</div><div id="stats"><span id="life">❤️ 100</span><span id="gems">💎 0</span><span id="progress">⭐ 0/4</span></div><div id="hpbar"><div id="hpfill"></div></div></div><button id="menu" aria-label="Izbornik">☰</button></div><div id="task" class="glass"><strong>MISIJA:</strong> <span id="objective">Pronađi četiri čarobna izazova.</span></div><canvas id="map" width="250" height="172"></canvas><div id="controls"><div id="stick"><div id="knob"></div></div><div class="buttons"><button id="use" class="action gold">✋<small>UZMI</small></button><button id="hit" class="action">✨<small>ČAROLIJA</small></button></div></div><div id="toast"></div><div id="overlay" class="overlay show"><div class="panel"><div id="eyebrow" class="eyebrow">NOVA PUSTOLOVINA</div><h1 id="heading">Milo & Lilo 3.1</h1><p id="description">Čarobni otoci trebaju pomoć! Pronađi izgubljene zvijezde, riješi zagonetke i otjeraj nestašne sjene.</p><div id="extra"></div><div id="choices" class="choices"></div><p id="feedback" class="feedback"></p><button id="primary" class="wide">▶ Započni avanturu</button><button id="secondary" class="wide secondary" style="display:none">Natrag</button></div></div>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),c=$('game'),g=c.getContext('2d'),mg=$('map').getContext('2d'),T=Math.PI*2,W=2100,H=1400,clamp=(x,a,b)=>Math.max(a,Math.min(b,x)),rnd=(a,b)=>a+Math.random()*(b-a),ri=(a,b)=>Math.floor(rnd(a,b+1)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),zones=['Smaragdna obala','Mjesečeva šuma','Kristalni hram'],icons=['🌴','🌙','💎'];let vw,vh,dpr,scale,cam={x:0,y:0},tick=0,last=0,paused=true,jo={x:0,y:0},keys={},fx=[],enemies=[],drops=[],props=[],puzzles=[],portal={x:1910,y:740},npc={x:330,y:350},near=null,toastTimer=0,attackCD=0,mode='start',sound=true;const defaults=()=>({zone:0,hero:0,gems:0,completed:[[],[],[]],hp:100,maxhp:100,damage:1,speed:1,stars:0});function loadSave(){const x=JSON.parse(localStorage.getItem('milo_lilo_v3'));if(!x||typeof x!=='object'||Array.isArray(x))return defaults();const result=defaults();result.zone=Number.isInteger(x.zone)&&x.zone>=0&&x.zone<3?x.zone:0;result.hero=x.hero===1?1:0;result.gems=Number.isFinite(x.gems)?Math.max(0,Math.floor(x.gems)):0;result.completed=Array.from({length:3},(_,i)=>Array.isArray(x.completed)&&Array.isArray(x.completed[i])?[...new Set(x.completed[i].filter(id=>Number.isInteger(id)&&id>=0&&id<4))]:[]);result.maxhp=Number.isFinite(x.maxhp)?Math.max(100,x.maxhp):100;result.hp=Number.isFinite(x.hp)?clamp(x.hp,1,result.maxhp):result.maxhp;result.damage=Number.isFinite(x.damage)?Math.max(1,Math.floor(x.damage)):1;result.speed=Number.isFinite(x.speed)?Math.max(1,x.speed):1;result.stars=result.completed.reduce((total,zone)=>total+zone.length,0);return result}let save=defaults();try{save=loadSave()}catch(error){console.warn('Nije moguće učitati spremljeni napredak:',error);save=defaults()}let player={x:255,y:380,r:20,inv:0,cast:0,face:1};const store=()=>{try{localStorage.setItem('milo_lilo_v3',JSON.stringify(save))}catch{}};function resize(){vw=innerWidth;vh=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=Math.round(vw*dpr);c.height=Math.round(vh*dpr);g.setTransform(dpr,0,0,dpr,0,0);scale=clamp(Math.min(vw/440,vh/720),.7,1.18)}addEventListener('resize',resize);resize();function seeded(i){let v=Math.sin(i*127.1+save.zone*119.7)*43758.5453;return v-Math.floor(v)}
function setup(){player.x=255;player.y=380;player.inv=0;save.hp=clamp(save.hp,1,save.maxhp);fx=[];enemies=[];drops=[];props=[];puzzles=[{x:660,y:340,id:0,type:'math',name:'Brojevna škrinja'},{x:1100,y:940,id:1,type:'word',name:'Izgubljena slova'},{x:1480,y:390,id:2,type:'pattern',name:'Most uzoraka'},{x:1680,y:1030,id:3,type:'memory',name:'Čarobno pamćenje'}];let completed=save.completed[save.zone]||[];for(let i=0;i<13+save.zone*3;i++){let x=ri(530,1880),y=ri(150,1250);if(puzzles.some(p=>Math.hypot(x-p.x,y-p.y)<120))continue;enemies.push({x,y,hx:x,hy:y,hp:2+save.zone,phase:rnd(0,6),speed:rnd(.55,.9)+save.zone*.13,hit:0})}for(let i=0;i<34;i++)drops.push({x:ri(300,1840),y:ri(120,1260),v:ri(2,5)});for(let i=0;i<215;i++){let x=seeded(i*2+3)*W,y=seeded(i*2+4)*H;if(Math.hypot(x-255,y-380)<145)continue;props.push({x,y,t:seeded(i+900)>.6?'tree':seeded(i+450)>.55?'rock':'flower',s:.7+seeded(i+710)*.7})}update();store()}
function update(){let count=(save.completed[save.zone]||[]).length;$('zone').textContent=icons[save.zone]+' '+zones[save.zone].toUpperCase();$('life').textContent='❤️ '+Math.ceil(save.hp)+'/'+save.maxhp;$('gems').textContent='💎 '+save.gems;$('progress').textContent='⭐ '+count+'/4';$('hpfill').style.width=(100*save.hp/save.maxhp)+'%';$('objective').textContent=count===4?'Sve zvijezde pronađene! Pronađi portal na istoku.':'Pronađi '+(4-count)+' čarobna izazova i osvoji zvijezde.';store()}
function toast(s){$('toast').textContent=s;$('toast').classList.add('on');toastTimer=performance.now()+2500}function burst(x,y,color='#fff5a8',n=15){for(let i=0;i<n;i++)fx.push({x,y,vx:rnd(-4,4),vy:rnd(-4,1),life:ri(20,42),color})}function tone(f=550,d=.11){if(!sound)return;try{let A=window.AudioContext||window.webkitAudioContext;let ctx=tone.ctx||(tone.ctx=new A()),o=ctx.createOscillator(),v=ctx.createGain();o.type='sine';o.frequency.value=f;v.gain.setValueAtTime(.035,ctx.currentTime);v.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+d);o.connect(v).connect(ctx.destination);o.start();o.stop(ctx.currentTime+d)}catch{}}
function bumpModal(){ $('overlay').dataset.version=String(Number($('overlay').dataset.version||0)+1)}function modal(eyebrow,title,desc){bumpModal();paused=true;jo.x=jo.y=0;$('knob').style.transform='';$('overlay').classList.add('show');$('eyebrow').textContent=eyebrow;$('heading').textContent=title;$('description').textContent=desc;$('extra').replaceChildren();$('choices').replaceChildren();$('choices').style.display='grid';$('feedback').textContent='';$('primary').style.display='none';$('secondary').style.display='none';$('secondary').onclick=close;$('secondary').textContent='▶ Nastavi igru'}function close(){bumpModal();$('choices').style.flexDirection='';paused=false;$('overlay').classList.remove('show');mode='play'}function primary(label,fn){$('primary').style.display='block';$('primary').textContent=label;$('primary').onclick=fn}function secondary(label,fn=close){$('secondary').style.display='block';$('secondary').textContent=label;$('secondary').onclick=fn}function button(text,fn){let b=document.createElement('button');b.className='choice';b.textContent=text;b.onclick=()=>{tone(480);fn(b)};$('choices').append(b);return b}function success(p){if((save.completed[save.zone]||[]).includes(p.id))return;save.completed[save.zone].push(p.id);save.gems+=25;save.stars++;tone(880,.2);burst(p.x,p.y,'#ffeaa0',38);update();close();toast('⭐ Zvijezda osvojena! +25 💎')}
function puzzle(p){mode='puzzle';if(p.type==='math'){let a=ri(0,10),sub=Math.random()<.5,b=sub?ri(0,a):ri(0,10-a),answer=sub?a-b:a+b;modal('🔐 BROJEVNA ŠKRINJA','Otvori škrinju',`Koliko je ${a} ${sub?'−':'+'} ${b}?`);let options=new Set([answer]);while(options.size<4)options.add(ri(0,10));[...options].sort(()=>Math.random()-.5).forEach(n=>button(String(n),el=>judge(n===answer,el,()=>success(p),'Broji polako, možeš koristiti prstiće.')))}else if(p.type==='word'){let words=[['🐻','MEDO'],['🐰','ZEKO'],['🐟','RIBA'],['🐱','MACA'],['🐶','PAS'],['🌊','MORE'],['☀️','SUNCE'],['🏠','KUĆA'],['🌳','ŠUMA'],['🦉','SOVA'],['🦁','LAV'],['⛵','BROD']];let [emoji,word]=words[ri(0,words.length-1)];let pool=new Set([word]);while(pool.size<4)pool.add(words[ri(0,words.length-1)][1]);modal('🔤 IZGUBLJENA SLOVA','Pronađi riječ',`Koja riječ odgovara slici ${emoji}?`);[...pool].sort(()=>Math.random()-.5).forEach(w=>button(w,el=>judge(w===word,el,()=>success(p),'Pogledaj prvo i zadnje slovo.')))}else if(p.type==='pattern'){let variants=[{s:'🔴 🔵 🔴 🔵 🔴 ❓',a:'🔵',opts:['🔴','🔵','🟢','🟡']},{s:'⭐ 🌙 ⭐ 🌙 ⭐ ❓',a:'🌙',opts:['⭐','☀️','🌙','💎']},{s:'1  2  3  4  ❓',a:'5',opts:['3','5','6','7']},{s:'2  4  6  ❓',a:'8',opts:['7','8','9','10']},{s:'🟩 🟩 🟨 🟩 🟩 ❓',a:'🟨',opts:['🟩','🟦','🟨','🟥']}];let v=variants[ri(0,variants.length-1)];modal('🌉 MOST UZORAKA','Što dolazi dalje?',v.s);v.opts.sort(()=>Math.random()-.5).forEach(n=>button(n,el=>judge(n===v.a,el,()=>success(p),'Potraži što se ponavlja.')))}else memory(p)}
function judge(ok,el,fn,hint){if(ok){let version=$('overlay').dataset.version;$('feedback').textContent='✨ Bravo!';[...$('choices').children].forEach(x=>x.disabled=true);setTimeout(()=>{if(mode==='puzzle'&&version===$('overlay').dataset.version)fn()},550)}else{el.disabled=true;$('feedback').textContent='💛 '+hint;tone(260,.15)}}
function memory(p){let symbols=['🐰','🐻','⭐','🌙','🍎','🐟','🌸','💎'];let chosen=Array.from({length:3},()=>symbols[ri(0,symbols.length-1)]);modal('🧠 ČAROBNO PAMĆENJE','Zapamti redoslijed','Dobro pogledaj tri sličice. Zatim ih dodirni istim redom.');let d=document.createElement('div');d.className='sequence';d.textContent=chosen.join(' ');$('extra').append(d);$('feedback').textContent='Zapamti sličice…';let active=true;let timer=setTimeout(()=>{if(mode!=='puzzle')return;active=false;d.textContent='❓ ❓ ❓';$('feedback').textContent='Dodirni sličice redom!';let i=0;let choices=[...new Set(chosen)];for(const symbol of symbols){if(choices.length>=6)break;if(!choices.includes(symbol))choices.push(symbol)}choices.sort(()=>Math.random()-.5);choices.forEach(s=>button(s,el=>{if(s===chosen[i]){i++;$('feedback').textContent='⭐ '.repeat(i);tone(600+i*100);if(i===chosen.length){let version=$('overlay').dataset.version;[...$('choices').children].forEach(x=>x.disabled=true);setTimeout(()=>{if(mode==='puzzle'&&version===$('overlay').dataset.version)success(p)},450)}}else{$('feedback').textContent='Pokušaj ponovno! Pogledaj sličice još jednom.';[...$('choices').children].forEach(x=>x.remove());memory(p)}}))},2900);$('secondary').style.display='block';secondary('Odustani',()=>{clearTimeout(timer);close()})}
function interact(){if(paused)return;let candidates=[...puzzles.filter(p=>!(save.completed[save.zone]||[]).includes(p.id)),{...npc,type:'shop'},{...portal,type:'portal'}].sort((a,b)=>dist(a,player)-dist(b,player));let p=candidates[0];if(!p||dist(p,player)>110){toast('Priđi knjizi, Lilu ili portalu.');return}if(p.type==='shop')shop();else if(p.type==='portal')gate();else puzzle(p)}
function shop(){
 mode='shop';
 modal('🐻 LILINA TRGOVINA','Čarobne nadogradnje','Skupljaj dragulje i postani snažniji!');
 const area=$('choices');area.replaceChildren();area.style.display='flex';area.style.flexDirection='column';
 const items=[
  {name:'❤️ Više zdravlja',cost:50,apply:function(){save.maxhp+=20;save.hp=save.maxhp}},
  {name:'✨ Jača čarolija',cost:65,apply:function(){save.damage++}},
  {name:'👟 Brže noge',cost:55,apply:function(){save.speed+=.17}},
  {name:'💚 Obnovi zdravlje',cost:15,apply:function(){save.hp=save.maxhp}}
 ];
 for(const item of items){
  const row=document.createElement('div');row.className='shopitem';
  const label=document.createElement('span');label.textContent=item.name;
  const buy=document.createElement('button');buy.textContent=item.cost+' 💎';
  buy.addEventListener('click',function(){
   if(save.gems<item.cost){$('feedback').textContent='Nedostaje još '+(item.cost-save.gems)+' dragulja.';return}
   save.gems-=item.cost;item.apply();update();tone(800);buy.disabled=true;buy.textContent='Kupljeno ✓';
   $('feedback').textContent='✨ Nadogradnja kupljena!';
  });
  row.appendChild(label);row.appendChild(buy);area.appendChild(row);
 }
 secondary('▶ Nastavi igru',close);
}
function gate(){if((save.completed[save.zone]||[]).length<4){toast('🔒 Prvo osvoji sve četiri zvijezde!');return}if(save.zone===2){mode='win';modal('🏆 VELIKA POBJEDA','Otoci su spašeni!','Milo i Lilo vratili su čaroliju svim otocima! Možeš ponovno krenuti u avanturu.');primary('🔄 Nova pustolovina',()=>{save=defaults();setup();close()});secondary('Još istražuj',close)}else{mode='gate';modal('🌈 NOVI OTOK','Portal je otvoren!','Bravo! Novi otok skriva drugačije izazove i snažnije sjene.');primary('➡️ Putuj dalje',()=>{save.zone++;save.hp=save.maxhp;setup();close()});secondary('Ostani ovdje',close)}}
function attack(){if(paused||attackCD>0)return;attackCD=10;player.cast=10;let hits=0;for(let e of enemies){if(e.hp<=0)continue;let d=dist(e,player),forward=(e.x-player.x)*player.face;if(d<115&&forward>-35){e.hp-=save.damage;e.hit=16;hits++;burst(e.x,e.y,'#ffb2ea',10);if(e.hp<=0){save.gems+=ri(4,8);burst(e.x,e.y,'#ffeab0',18)}}}tone(hits?680:380);if(hits)toast('✨ Čarobni pogodak!');update()}
function damage(){if(player.inv>0)return;save.hp-=13+save.zone*4;player.inv=58;burst(player.x,player.y,'#ff668c',15);tone(210,.2);if(save.hp<=0){save.hp=save.maxhp;player.x=255;player.y=380;save.gems=Math.max(0,save.gems-10);toast('💖 Novi pokušaj! −10 💎')}update()}
function drawTree(x,y,s){g.save();g.translate(x,y);g.scale(s,s);g.fillStyle='#07152a38';g.beginPath();g.ellipse(0,8,38,13,0,0,T);g.fill();g.fillStyle='#815d48';g.fillRect(-7,-42,14,51);for(let [dx,dy,r] of [[-19,-51,29],[18,-55,30],[0,-78,35]]){g.fillStyle=['#328c70','#527e9d','#8d72c4'][save.zone];g.beginPath();g.arc(dx,dy,r,0,T);g.fill();g.fillStyle='#ffffff1c';g.beginPath();g.arc(dx-8,dy-8,r*.46,0,T);g.fill()}g.restore()}

for(let d of drops){g.save();g.translate(d.x,d.y+Math.sin(tick*.07+d.x)*4);g.rotate(Math.PI/4);g.fillStyle='#a0fff3';g.shadowColor='#affff8';g.shadowBlur=13;g.fillRect(-8,-8,16,16);g.restore()}for(let p of puzzles){if((save.completed[save.zone]||[]).includes(p.id))continue;g.save();g.translate(p.x,p.y+Math.sin(tick*.06+p.id)*6);g.shadowColor='#ffe6a0';g.shadowBlur=25;g.fillStyle='#fff3c9';g.beginPath();g.roundRect(-29,-33,58,66,12);g.fill();g.shadowBlur=0;g.fillStyle='#68449e';g.font='bold 35px system-ui';g.textAlign='center';g.fillText(['🔢','🔤','🔮','🧠'][p.id],0,12);g.font='bold 13px system-ui';g.fillStyle='#fff';g.strokeStyle='#20354d';g.lineWidth=4;g.strokeText(p.name,0,-51);g.fillText(p.name,0,-51);g.restore()}
g.save();g.translate(npc.x,npc.y);g.fillStyle='#b38360';g.beginPath();g.arc(0,-12,27,0,T);g.arc(-20,-30,11,0,T);g.arc(20,-30,11,0,T);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(-9,-15,7,0,T);g.arc(9,-15,7,0,T);g.fill();g.fillStyle='#26354c';g.beginPath();g.arc(-9,-15,3,0,T);g.arc(9,-15,3,0,T);g.fill();g.textAlign='center';g.font='bold 14px system-ui';g.fillStyle='#fff';g.fillText('🐻 LILO · TRGOVINA',0,-58);g.restore();let unlocked=(save.completed[save.zone]||[]).length===4;g.save();g.translate(portal.x,portal.y);g.shadowColor=unlocked?'#adfff2':'#bc9de9';g.shadowBlur=30;g.strokeStyle=unlocked?'#83fff0':'#a486cb';g.lineWidth=16;g.beginPath();g.ellipse(0,-25,45,70,0,0,T);g.stroke();g.fillStyle=unlocked?'#8effe95b':'#66499c8b';g.beginPath();g.ellipse(0,-25,35,60,0,0,T);g.fill();g.restore();for(let e of enemies){if(e.hp<=0)continue;g.save();g.translate(e.x,e.y+Math.sin(tick*.12+e.phase)*3);g.fillStyle=e.hit>0?'#ffd9e7':'#9865ca';g.beginPath();g.ellipse(0,0,22,19,0,0,T);g.fill();g.fillStyle='#fff';for(let x of [-8,8]){g.beginPath();g.arc(x,-5,6,0,T);g.fill()}g.fillStyle='#293550';for(let x of [-8,8]){g.beginPath();g.arc(x,-5,3,0,T);g.fill()}g.restore()}hero(player.x,player.y,save.hero===1);for(let f of fx){g.globalAlpha=Math.max(0,f.life/42);g.fillStyle=f.color;g.beginPath();g.arc(f.x,f.y,3,0,T);g.fill()}g.globalAlpha=1;g.restore();if(unlocked){let a=Math.atan2(portal.y-player.y,portal.x-player.x);g.save();g.translate(vw/2,62);g.rotate(a+Math.PI/2);g.fillStyle='#ffe59a';g.beginPath();g.moveTo(0,-13);g.lineTo(-10,11);g.lineTo(10,11);g.closePath();g.fill();g.restore()}drawMap()}
function drawMap(){let cw=250,ch=172;mg.clearRect(0,0,cw,ch);mg.fillStyle='#2b5b65';mg.fillRect(0,0,cw,ch);mg.strokeStyle='#e7d6a1';mg.lineWidth=9;mg.lineCap='round';mg.beginPath();mg.moveTo(27,48);mg.bezierCurveTo(80,28,85,100,135,98);mg.bezierCurveTo(170,155,194,75,226,91);mg.stroke();for(let p of puzzles){mg.fillStyle=(save.completed[save.zone]||[]).includes(p.id)?'#9cf4ad':'#ffe2a3';mg.beginPath();mg.arc(p.x/W*cw,p.y/H*ch,5,0,T);mg.fill()}mg.fillStyle='#ff8ac1';mg.beginPath();mg.arc(portal.x/W*cw,portal.y/H*ch,6,0,T);mg.fill();mg.fillStyle='#fff';mg.beginPath();mg.arc(player.x/W*cw,player.y/H*ch,6,0,T);mg.fill()}
function step(dt){tick+=dt;let dx=jo.x+(keys.right?1:0)-(keys.left?1:0),dy=jo.y+(keys.down?1:0)-(keys.up?1:0),m=Math.hypot(dx,dy);if(m>0){dx/=Math.max(1,m);dy/=Math.max(1,m);player.x=clamp(player.x+dx*(3.25+save.speed*.55)*dt,45,W-45);player.y=clamp(player.y+dy*(3.25+save.speed*.55)*dt,65,H-55);if(Math.abs(dx)>.13)player.face=Math.sign(dx)}player.inv=Math.max(0,player.inv-dt);player.cast=Math.max(0,player.cast-dt);attackCD=Math.max(0,attackCD-dt);for(let e of enemies){if(e.hp<=0)continue;let d=dist(e,player),target=d<270?player:{x:e.hx+Math.cos(tick*.013+e.phase)*70,y:e.hy+Math.sin(tick*.015+e.phase)*60},a=Math.atan2(target.y-e.y,target.x-e.x);e.x+=Math.cos(a)*e.speed*dt*(d<270?1.55:1);e.y+=Math.sin(a)*e.speed*dt*(d<270?1.55:1);if(d<36)damage();e.hit=Math.max(0,e.hit-dt)}for(let i=drops.length-1;i>=0;i--){if(dist(player,drops[i])<33){save.gems+=drops[i].v;burst(drops[i].x,drops[i].y,'#9cfff6',7);drops.splice(i,1);update();tone(780,.06)}}for(let i=fx.length-1;i>=0;i--){let f=fx[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.vy+=.12*dt;f.life-=dt;if(f.life<=0)fx.splice(i,1)}let candidates=[...puzzles.filter(p=>!(save.completed[save.zone]||[]).includes(p.id)),npc,portal].sort((a,b)=>dist(a,player)-dist(b,player));near=candidates[0];$('use').style.opacity=near&&dist(near,player)<110?'1':'.6';if(toastTimer&&performance.now()>toastTimer){$('toast').classList.remove('on');toastTimer=0}}
function loop(now){let dt=Math.min(2,(now-last)/16.67||1);last=now;if(!paused)step(dt);render();requestAnimationFrame(loop)}function menu(){mode='menu';modal('⚙️ POSTAVKE','Milo & Lilo 3','Odaberi junaka ili nastavi pustolovinu.');button('🐰 Milo',()=>{save.hero=0;update();$('feedback').textContent='Milo je odabran!'});button('🐻 Lilo',()=>{save.hero=1;update();$('feedback').textContent='Lilo je odabran!'});button(sound?'🔊 Zvuk: DA':'🔇 Zvuk: NE',el=>{sound=!sound;el.textContent=sound?'🔊 Zvuk: DA':'🔇 Zvuk: NE'});button('🗑️ Nova igra',()=>{if(confirm('Želiš li izbrisati napredak i krenuti ispočetka?')){save=defaults();setup();close()}});primary('▶ Nastavi igru',close)}
let stick=$('stick'),knob=$('knob'),pointer=null;function moveStick(e){let b=stick.getBoundingClientRect(),cx=b.left+b.width/2,cy=b.top+b.height/2,dx=e.clientX-cx,dy=e.clientY-cy,max=b.width*.32,d=Math.hypot(dx,dy)||1,f=Math.min(1,max/d);dx*=f;dy*=f;jo.x=dx/max;jo.y=dy/max;knob.style.transform=`translate(${dx}px,${dy}px)`}stick.addEventListener('pointerdown',e=>{e.preventDefault();pointer=e.pointerId;stick.setPointerCapture(pointer);moveStick(e)});stick.addEventListener('pointermove',e=>{if(pointer===e.pointerId)moveStick(e)});function endStick(e){if(pointer!==e.pointerId)return;pointer=null;jo.x=jo.y=0;knob.style.transform=''}['pointerup','pointercancel','lostpointercapture'].forEach(x=>stick.addEventListener(x,endStick));$('hit').addEventListener('pointerdown',e=>{e.preventDefault();attack()});$('use').addEventListener('pointerdown',e=>{e.preventDefault();interact()});$('menu').onclick=menu;addEventListener('keydown',e=>{let k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};if(k[e.key]){e.preventDefault();keys[k[e.key]]=true}if(e.key===' '){e.preventDefault();attack()}if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>{let k={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'up',ArrowDown:'down',a:'left',d:'right',w:'up',s:'down'};if(k[e.key])keys[k[e.key]]=false});addEventListener('blur',()=>{keys={};jo.x=jo.y=0});

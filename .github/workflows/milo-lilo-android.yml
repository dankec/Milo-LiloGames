name: Milo & Lilo Android

on:
  workflow_dispatch:
  push:
    branches: [feature/lost-light-godot]
    paths:
      - 'Milo-Lilo-Lost-Light/**'
      - '.github/workflows/milo-lilo-android.yml'

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Generate original art and audio
        run: |
          python -m pip install Pillow
          # Audio and artwork are committed as source assets. No regeneration needed.
          python -m unittest discover -s Milo-Lilo-Lost-Light/tests -v
      - name: Install Godot 4.7.2 editor and Android export templates
        run: |
          set -euo pipefail
          BASE=https://github.com/godotengine/godot-builds/releases/download/4.7.2-stable
          curl -fL --retry 3 "$BASE/Godot_v4.7.2-stable_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godotbin
          chmod +x /tmp/godotbin/Godot_v4.7.2-stable_linux.x86_64
          echo /tmp/godotbin >> "$GITHUB_PATH"
          mkdir -p "$HOME/.local/share/godot/export_templates/4.7.2.stable"
          curl -fL --retry 3 "$BASE/Godot_v4.7.2-stable_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/export
          cp -R /tmp/export/templates/. "$HOME/.local/share/godot/export_templates/4.7.2.stable/"
      - name: Configure Android SDK and debug signing
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.android" dist
          keytool -genkeypair -noprompt -keystore "$HOME/.android/debug.keystore" \
            -alias androiddebugkey -storepass android -keypass android \
            -dname 'CN=Android Debug,O=Android,C=US' -keyalg RSA -keysize 2048 -validity 10000
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PATH=$HOME/.android/debug.keystore" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_USER=androiddebugkey" >> "$GITHUB_ENV"
          echo "GODOT_ANDROID_KEYSTORE_DEBUG_PASSWORD=android" >> "$GITHUB_ENV"
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' 'platform-tools'
      - name: Headless import, actual boot and Android configuration
        timeout-minutes: 4
        working-directory: Milo-Lilo-Lost-Light
        run: |
          set -euo pipefail
          GODOT=/tmp/godotbin/Godot_v4.7.2-stable_linux.x86_64
          timeout 90s "$GODOT" --headless --path . --editor --quit 2>&1 | tee /tmp/import.log
          timeout 45s "$GODOT" --headless --path . --script res://ci/verify_boot.gd 2>&1 | tee /tmp/boot.log
          grep -Fq 'BOOT_MENU_OK' /tmp/boot.log
          grep -Fq 'BOOT_GAME_OK' /tmp/boot.log
          timeout 30s "$GODOT" --headless --path . --editor --script res://ci/configure_android.gd 2>&1 | tee /tmp/config.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Invalid call|BOOT_FAILURE' /tmp/import.log /tmp/boot.log /tmp/config.log; then
            echo 'Godot startup or configuration errors detected'
            exit 1
          fi
      - name: Upload smoke-test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Milo-Lilo-ci-logs
          path: |
            /tmp/import.log
            /tmp/boot.log
            /tmp/config.log
          if-no-files-found: ignore
      - name: Export debug APK
        working-directory: Milo-Lilo-Lost-Light
        run: |
          set -euo pipefail
          /tmp/godotbin/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --export-debug Android ../dist/Milo-Lilo-Lost-Light-debug.apk 2>&1 | tee /tmp/export.log
          if grep -Eiq 'SCRIPT ERROR:|Parse Error:|Compile Error:|Failed to load script|Invalid call' /tmp/export.log; then exit 1; fi
          test -s ../dist/Milo-Lilo-Lost-Light-debug.apk
          unzip -t ../dist/Milo-Lilo-Lost-Light-debug.apk | tail -n 2
      - uses: actions/upload-artifact@v4
        with:
          name: Milo-Lilo-Android-debug
          path: dist/Milo-Lilo-Lost-Light-debug.apk
          if-no-files-found: error
          retention-days: 30

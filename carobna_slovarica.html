<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Čarobna slovarica</title><style>*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:linear-gradient(145deg,#b9f2ff,#fce5ff);min-height:100vh;color:#29335c;text-align:center}.app{max-width:850px;margin:auto;padding:22px}h1{font-size:clamp(2rem,6vw,3.5rem);margin:12px}.mascot{font-size:65px;animation:bob 2s infinite alternate}@keyframes bob{to{transform:translateY(-12px) rotate(7deg)}}.panel{background:#ffffffd9;border-radius:30px;padding:24px;box-shadow:0 12px 35px #6d73a333}.modes,.choices{display:flex;flex-wrap:wrap;justify-content:center;gap:12px;margin:22px 0}button{border:0;border-radius:18px;padding:16px 22px;font-size:1.2rem;font-weight:800;cursor:pointer;background:#fff;box-shadow:0 5px 0 #c4c7e0;color:#29335c;touch-action:manipulation}button:active{transform:translateY(4px);box-shadow:0 1px 0 #c4c7e0}button.selected{background:#ffe17c}button.answer{min-width:75px;font-size:2rem;background:#fef2b9}button:disabled{opacity:.5;cursor:default}.word{font-size:clamp(2.2rem,8vw,4.5rem);letter-spacing:.12em;font-weight:900;margin:25px 0;min-height:90px}.hint{font-size:1.3rem}.feedback{font-size:1.4rem;font-weight:800;min-height:42px}.score{font-size:1.2rem;font-weight:800}.next{background:#9af0b5}.reset{font-size:.9rem;padding:10px 14px}.confetti{position:fixed;top:-30px;pointer-events:none;animation:fall 1.7s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:0}}.small{font-size:.95rem;opacity:.75}</style></head><body><main class="app"><div class="mascot">🐻 🐰</div><h1>✨ Čarobna slovarica ✨</h1><div class="panel"><div class="score" id="score">⭐ 0 zvjezdica</div><div class="modes"><button id="missing" class="selected">🔎 Pronađi slovo</button><button id="build">🧩 Složi riječ</button><button id="math">🔢 Matematika</button></div><div class="hint" id="hint"></div><div class="word" id="word"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><button class="next" id="next">➡️ Sljedeći zadatak</button><p class="small">Igra radi i bez interneta. Zvuk se uključuje nakon prvog dodira.</p><button class="reset" id="reset">🔄 Počni ispočetka</button></div></main><script>const words=[['MAČKA','🐱'],['PAS','🐶'],['RIBA','🐟'],['KUĆA','🏠'],['SUNCE','☀️'],['OBLAK','☁️'],['CVJET','🌸'],['ZEC','🐰'],['MEDO','🐻'],['LOPTA','⚽'],['KRUH','🍞'],['VODA','💧'],['JABUKA','🍎'],['ŠUMA','🌳'],['PTICA','🐦'],['AUTO','🚗'],['MAMA','👩'],['TATA','👨'],['MORE','🌊'],['KONJ','🐴']].filter(x=>x[0].length>=4&&x[0].length<=5);let mode='missing',score=0,task=null,done=false,progress=0;const $=id=>document.getElementById(id),shuffle=a=>[...a].sort(()=>Math.random()-.5),rand=n=>Math.floor(Math.random()*n);function speak(s){try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(s);u.lang='hr-HR';u.rate=.85;speechSynthesis.speak(u)}catch(e){}}function stars(){for(let i=0;i<22;i++){let d=document.createElement('span');d.className='confetti';d.textContent=['⭐','✨','🎉','💛'][rand(4)];d.style.left=rand(100)+'vw';d.style.animationDelay=Math.random()*.4+'s';d.style.fontSize=(18+rand(25))+'px';document.body.append(d);setTimeout(()=>d.remove(),2300)}}function choice(label,fn){const b=document.createElement('button');b.className='answer';b.textContent=label;b.onclick=fn;$('choices').append(b)}function finish(ok){if(done)return;if(ok){done=true;score++;$('score').textContent='⭐ '+score+' zvjezdica';$('feedback').textContent=['Bravo! 🌟','Odlično! 🎉','Sjajno! 💛','Točno! 🥳'][rand(4)];stars();speak('Bravo!');document.querySelectorAll('.answer').forEach(b=>b.disabled=true)}else{$('feedback').textContent='Pokušaj ponovno! 💪';speak('Pokušaj ponovno')}}function newTask(){done=false;progress=0;$('feedback').textContent='';$('choices').innerHTML='';if(mode==='math'){let a=rand(11),b=rand(11),plus=Math.random()<.5;if(!plus&&b>a)[a,b]=[b,a];if(plus&&a+b>10)b=rand(11-a);const answer=plus?a+b:a-b;task={answer};$('hint').textContent='Izračunaj i odaberi odgovor';$('word').textContent=`${a} ${plus?'+':'−'} ${b} = ?`;let opts=new Set([answer]);while(opts.size<4)opts.add(rand(11));shuffle([...opts]).forEach(v=>choice(v,()=>finish(v===answer)));return}let w=words[rand(words.length)];task={word:w[0],emoji:w[1]};if(mode==='missing'){let pos=rand(w[0].length);task.answer=w[0][pos];$('hint').textContent='Koje slovo nedostaje? '+w[1];$('word').textContent=w[0].slice(0,pos)+' _ '+w[0].slice(pos+1);let opts=new Set([task.answer]);let alphabet='ABCDEFGHIJKLMNOPRSTUVZČĆĐŠŽ';while(opts.size<4)opts.add(alphabet[rand(alphabet.length)]);shuffle([...opts]).forEach(v=>choice(v,()=>{if(v===task.answer){$('word').textContent=w[0]}finish(v===task.answer)}))}else{$('hint').textContent='Složi riječ prema slici '+w[1];$('word').textContent='＿ '.repeat(w[0].length);const letters=shuffle([...w[0]].map((letter,id)=>({letter,id})));letters.forEach(({letter,id})=>choice(letter,()=>{if(done)return;if(letter===w[0][progress]){progress++;const btn=[...document.querySelectorAll('.answer')].find(b=>b.dataset.id===String(id));btn.disabled=true;$('word').textContent=w[0].slice(0,progress)+'＿'.repeat(w[0].length-progress);$('feedback').textContent='';if(progress===w[0].length)finish(true)}else finish(false)}));[...document.querySelectorAll('.answer')].forEach((b,i)=>b.dataset.id=letters[i].id)}}['missing','build','math'].forEach(m=>$(m).onclick=()=>{mode=m;document.querySelectorAll('.modes button').forEach(b=>b.classList.toggle('selected',b.id===m));newTask()});$('next').onclick=newTask;$('reset').onclick=()=>{score=0;$('score').textContent='⭐ 0 zvjezdica';newTask()};newTask();</script></body></html>

<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Čarobna slovarica – avantura</title><style>
*{box-sizing:border-box}body{margin:0;font-family:system-ui,'Segoe UI',sans-serif;background:#d9f6ff;color:#26334b}button{font:inherit;cursor:pointer}main{max-width:940px;margin:auto;padding:18px}h1{text-align:center;margin:8px 0;font-size:clamp(26px,5vw,42px)}.sub{text-align:center;margin:0 0 15px}.hud{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;font-weight:800}.pill{background:white;border-radius:30px;padding:9px 15px;box-shadow:0 4px 0 #a9dce6}.world{position:relative;height:270px;overflow:hidden;border:5px solid white;border-radius:28px;background:linear-gradient(#91d9ff 0 65%,#7ed67b 65%);box-shadow:0 8px 0 #a7d3e0}.sun{position:absolute;right:45px;top:25px;font-size:55px}.cloud{position:absolute;top:25px;left:12%;font-size:55px;animation:float 6s ease-in-out infinite alternate}.tree{position:absolute;bottom:52px;font-size:90px}.tree.a{left:4%}.tree.b{right:6%}.path{position:absolute;bottom:0;height:80px;width:100%;background:#d4a978;clip-path:polygon(0 80%,100% 35%,100% 100%,0 100%)}.hero{position:absolute;bottom:32px;left:8%;font-size:72px;transition:left .8s ease;filter:drop-shadow(0 7px 2px #0002);animation:bob 1.5s infinite}.friend{position:absolute;bottom:50px;right:16%;font-size:66px;animation:bob 1.8s infinite}.star{position:absolute;font-size:30px;animation:twinkle 1.5s infinite alternate}.task{background:#fff;border-radius:26px;padding:22px;margin-top:15px;text-align:center;box-shadow:0 8px 0 #b7dfe9}.modes{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:13px 0}.mode{border:0;background:#e4eafa;border-radius:20px;padding:11px 16px;font-weight:800}.mode.active{background:#7653d9;color:white}.prompt{font-size:clamp(24px,5vw,36px);font-weight:900;margin:12px 0}.hint{color:#59647c}.choices{display:flex;justify-content:center;gap:12px;flex-wrap:wrap;margin:20px 0 8px}.choice{min-width:67px;min-height:67px;border:0;border-radius:19px;background:#ffdb74;box-shadow:0 5px 0 #d5a13d;font-size:30px;font-weight:900}.choice:hover{transform:translateY(-2px)}.choice:active{transform:translateY(3px);box-shadow:0 2px 0 #d5a13d}.choice:disabled{opacity:.45;cursor:default}.feedback{min-height:36px;font-weight:900;font-size:21px}.footer{display:flex;justify-content:center;gap:12px;flex-wrap:wrap}.secondary{border:0;background:#dceaf7;padding:12px 18px;border-radius:15px;font-weight:700}.primary{border:0;background:#61c88b;padding:12px 20px;border-radius:15px;font-weight:800}.chest{display:none;position:fixed;inset:0;background:#172044aa;z-index:10;align-items:center;justify-content:center;padding:18px}.chest.show{display:flex}.chestbox{background:white;padding:35px;border-radius:30px;text-align:center;max-width:440px;animation:pop .4s}.chesticon{font-size:90px;animation:bob 1s infinite}.chestbox h2{font-size:30px}.confetti{position:fixed;pointer-events:none;font-size:30px;animation:fall 1.4s forwards;z-index:20}@keyframes bob{50%{transform:translateY(-9px)}}@keyframes float{to{transform:translateX(35px)}}@keyframes twinkle{to{transform:scale(1.3);opacity:.5}}@keyframes pop{from{transform:scale(.6)}to{transform:scale(1)}}@keyframes fall{to{transform:translateY(100vh) rotate(440deg);opacity:0}}@media(max-width:550px){.world{height:220px}.hero{font-size:58px}.friend{font-size:52px}.tree{font-size:65px}.choice{min-width:57px;min-height:60px}.task{padding:15px}}
</style></head><body><main><h1>🌟 Čarobna slovarica 🌟</h1><p class="sub">Pomozi zeki i medi proći kroz čarobnu šumu!</p><div class="hud"><span class="pill" id="level">🌳 Razina 1</span><span class="pill" id="score">⭐ 0 zvjezdica</span><span class="pill" id="progress">🎁 Škrinja: 0/5</span></div><div class="world" aria-label="Animirana šuma"><span class="sun">☀️</span><span class="cloud">☁️</span><span class="tree a">🌳</span><span class="tree b">🌲</span><div class="path"></div><span class="star" style="left:35%;top:38%">✨</span><span class="star" style="left:65%;top:23%">⭐</span><span class="hero" id="hero">🐰</span><span class="friend">🐻</span></div><div class="task"><div class="modes"><button class="mode active" data-mode="missing">🔤 Pronađi slovo</button><button class="mode" data-mode="order">🧩 Složi riječ</button><button class="mode" data-mode="math">🔢 Matematika</button><button class="mode" data-mode="mix">🎲 Iznenađenje</button></div><p class="hint" id="hint">Koje slovo nedostaje?</p><div class="prompt" id="prompt"></div><div class="choices" id="choices"></div><div class="feedback" id="feedback" aria-live="polite"></div><div class="footer"><button class="secondary" id="sound">🔊 Zvuk uključen</button><button class="secondary" id="skip">⏭️ Drugi zadatak</button><button class="primary" id="restart">↻ Nova igra</button></div></div></main><div class="chest" id="chest"><div class="chestbox"><div class="chesticon">🎁✨</div><h2>Otvorena je čarobna škrinja!</h2><p>Bravo! Osvojio/la si pet zvjezdica i otključao/la novu razinu!</p><button class="primary" id="continue">Nastavi avanturu ➜</button></div></div><script>
const words=[['MAČKA','🐱'],['KUĆA','🏠'],['SUNCE','☀️'],['RIBA','🐟'],['ZIMA','❄️'],['LAV','🦁'],['MORE','🌊'],['LOPTA','⚽'],['MEDO','🐻'],['ZEKO','🐰'],['CVJET','🌼'],['OBLAK','☁️'],['PTICA','🐦'],['KNJIGA','📖'],['TRAVA','🌱'],['KRUH','🍞'],['JABUKA','🍎'],['VODA','💧'],['ŠUMA','🌳'],['ČIZMA','🥾'],['ŽABA','🐸'],['NOĆ','🌙'],['DUGA','🌈'],['ZUBI','🦷'],['BROD','⛵']].filter(x=>x[0].length>=4&&x[0].length<=5);let mode='missing',score=0,round=0,question=null,locked=false,sound=true,used=[],orderIndex=0;const $=id=>document.getElementById(id),random=a=>a[Math.floor(Math.random()*a.length)];function speak(t){if(!sound||!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='hr-HR';u.rate=.85;speechSynthesis.speak(u)}function nextWord(){if(used.length>=words.length)used=[];let options=words.filter(x=>!used.includes(x[0]));let w=random(options);used.push(w[0]);return w}function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function newTask(){locked=false;orderIndex=0;$('feedback').textContent='';$('choices').innerHTML='';let current=mode==='mix'?random(['missing','order','math']):mode;if(current==='math'){let a=Math.floor(Math.random()*11),b=Math.floor(Math.random()*11),plus=Math.random()<.5;if(!plus&&b>a)[a,b]=[b,a];if(plus&&a+b>10)b=10-a;let answer=plus?a+b:a-b;question={type:'math',answer};$('hint').textContent='Izračunaj i odaberi točan broj.';$('prompt').textContent=`${a} ${plus?'+':'−'} ${b} = ?`;let vals=new Set([answer]);while(vals.size<4)vals.add(Math.floor(Math.random()*11));shuffle([...vals]).forEach(v=>addChoice(v,()=>check(v===answer,String(answer))))}else{let [word,emoji]=nextWord();if(current==='missing'){let i=Math.floor(Math.random()*word.length),answer=word[i];question={type:'missing',answer};$('hint').textContent='Koje slovo nedostaje?';$('prompt').textContent=emoji+'  '+word.slice(0,i)+' _ '+word.slice(i+1);let letters=new Set([answer]);let alphabet='ABCDEFIJKLMNOPRSTUVZČĆĐŠŽG';while(letters.size<4)letters.add(random([...alphabet]));shuffle([...letters]).forEach(l=>addChoice(l,()=>check(l===answer,word)))}else{question={type:'order',word};$('hint').textContent='Dodiruj slova redom i složi riječ.';$('prompt').textContent=emoji+'  '+Array(word.length).fill('_').join(' ');let arr=shuffle([...word].map((letter,id)=>({letter,id})));arr.forEach(o=>addChoice(o.letter,(btn)=>{if(locked)return;if(o.letter===word[orderIndex]){btn.disabled=true;orderIndex++;$('prompt').textContent=emoji+'  '+word.slice(0,orderIndex).split('').join(' ')+' '+Array(word.length-orderIndex).fill('_').join(' ');if(orderIndex===word.length)check(true,word)}else{wrong()}},true))}}}function addChoice(label,cb,passButton=false){let b=document.createElement('button');b.className='choice';b.textContent=label;b.onclick=()=>{if(!locked)cb(passButton?b:undefined)};$('choices').appendChild(b)}function wrong(){$('feedback').textContent='💛 Pokušaj ponovno!';speak('Pokušaj ponovno')}function confetti(){for(let i=0;i<20;i++){let e=document.createElement('span');e.className='confetti';e.textContent=random(['⭐','✨','🎉','🌸']);e.style.left=Math.random()*100+'vw';e.style.top='-40px';e.style.animationDelay=Math.random()*.4+'s';document.body.appendChild(e);setTimeout(()=>e.remove(),2000)}}function check(ok,answer){if(!ok){wrong();return}locked=true;score++;round++;$('score').textContent='⭐ '+score+' zvjezdica';$('progress').textContent='🎁 Škrinja: '+round%5+'/5';$('level').textContent='🌳 Razina '+(Math.floor(round/5)+1);$('hero').style.left=(8+(round%5)*13)+'%';$('feedback').textContent='🌟 Bravo! '+answer;speak('Bravo! '+answer);confetti();if(round%5===0){$('progress').textContent='🎁 Škrinja: 5/5';setTimeout(()=>{$('chest').classList.add('show');speak('Čestitam! Otvorio si čarobnu škrinju!')},900)}else setTimeout(newTask,1450)}document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;document.querySelectorAll('[data-mode]').forEach(x=>x.classList.toggle('active',x===b));newTask()});$('continue').onclick=()=>{$('chest').classList.remove('show');$('hero').style.left='8%';newTask()};$('skip').onclick=newTask;$('restart').onclick=()=>{score=round=0;used=[];$('score').textContent='⭐ 0 zvjezdica';$('level').textContent='🌳 Razina 1';$('progress').textContent='🎁 Škrinja: 0/5';$('hero').style.left='8%';$('chest').classList.remove('show');newTask()};$('sound').onclick=()=>{sound=!sound;$('sound').textContent=sound?'🔊 Zvuk uključen':'🔇 Zvuk isključen';if(!sound&&'speechSynthesis'in window)speechSynthesis.cancel()};newTask();
</script></body></html>

<!doctype html><html lang="hr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Čarobna slovarica 3 — Skok u znanje</title><style>
:root{font-family:system-ui,Arial,sans-serif;color:#21334a}*{box-sizing:border-box}body{margin:0;background:linear-gradient(#17283e,#304d66);color:white}main{max-width:1100px;margin:auto;padding:12px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:clamp(19px,3vw,28px);margin:5px 0}button{border:0;border-radius:13px;padding:11px 15px;font:800 17px system-ui;background:#ffe38d;color:#28344a;cursor:pointer}button:focus-visible{outline:3px solid #fff}.hud{display:flex;gap:10px;flex-wrap:wrap;margin:8px 0;padding:10px;background:#ffffff18;border-radius:13px}.hud span{white-space:nowrap}canvas{display:block;width:100%;height:auto;border:4px solid #b7e8d3;border-radius:17px;background:#a7e8ff;touch-action:none}.mobile{display:flex;justify-content:space-between;margin:12px 0;gap:10px}.mobile>div{display:flex;gap:9px}.mobile button{min-width:68px;min-height:60px;font-size:24px;touch-action:none}.tip{font-size:14px;color:#e4f0fa;text-align:center}#message{min-height:25px;text-align:center;color:#fff0a3;font-weight:800}.overlay{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:#0b1b30d9;z-index:10}.overlay.active{display:flex}.panel{width:min(560px,100%);padding:25px;background:white;color:#24364d;border-radius:24px;text-align:center;box-shadow:0 22px 70px #0008}.panel h2{margin:0 0 10px}.panel .question{font-size:clamp(23px,5vw,34px);font-weight:850;letter-spacing:2px;margin:18px 0}.answers{display:grid;grid-template-columns:1fr 1fr;gap:12px}.answers button{font-size:24px;background:#c7f3de;min-height:62px}.answers button:disabled{opacity:.5}.feedback{min-height:25px;font-weight:800}.small{font-size:13px;color:#57667a}@media(max-width:550px){.mobile button{min-width:59px}.panel{padding:18px}}</style></head><body><main><header><h1>🐰 Čarobna slovarica 3: Skok u znanje</h1><button id="new">↻ Nova igra</button></header><div class="hud"><span id="world">🌳 Šuma</span><span id="coins">⭐ 0</span><span id="lives">❤️❤️❤️</span><span id="keys">🗝️ 0/3</span><span id="checkpoint">🚩 Početak</span></div><canvas id="game" width="1000" height="550" aria-label="Platformska igra s matematičkim i slovnim zadacima"></canvas><div class="mobile"><div><button data-key="left" aria-label="Lijevo">⬅️</button><button data-key="right" aria-label="Desno">➡️</button></div><div><button data-key="jump" aria-label="Skok">⬆️ SKOK</button></div></div><div id="message">Skoči na platforme, dotakni tri knjige i otključaj vrata!</div><p class="tip">Računalo: A/D ili ←/→ za hodanje, W / ↑ / razmak za skok. Mobitel: tipke na ekranu. Dodirni knjigu za zadatak, izbjegavaj neprijatelje.</p></main><div class="overlay" id="overlay" role="dialog" aria-modal="true"><div class="panel"><h2 id="title">Zadatak</h2><div id="question" class="question"></div><div id="answers" class="answers"></div><p class="feedback" id="feedback" aria-live="polite"></p><p class="small" id="note"></p></div></div><script>
(()=>{'use strict';
const canvas=document.querySelector('canvas'),g=canvas.getContext('2d'),$=id=>document.getElementById(id),W=1000,H=550;
const levels=[{name:'Čarobna šuma',sky:['#85d6f5','#e2faff'],ground:'#6ec57c',hill:'#3e9c70'},{name:'Sunčana livada',sky:['#83cdfa','#fff3b2'],ground:'#9dcb66',hill:'#84b45e'},{name:'Dvorac slova',sky:['#aaa2e9','#f6d7fb'],ground:'#b79add',hill:'#8c78bd'}];
const words=['MAČKA','SUNCE','LOPTA','RIBA','KAPA','KUĆA','OBLAK','PTICA','KONJ','BROD','ŠUMA','VODA','MORE','RUKA','NOGA','MEDO','ZEC','PAS','JABUKA','CVJET'];
let progress={level:0,stars:0,lives:3};
try{let s=JSON.parse(localStorage.getItem('carobna3'));if(s&&Number.isInteger(s.level))progress={level:Math.max(0,Math.min(2,s.level)),stars:Math.max(0,s.stars||0),lives:Math.max(1,Math.min(3,s.lives||3))}}catch(e){}
const save=()=>{try{localStorage.setItem('carobna3',JSON.stringify(progress))}catch(e){}};
const R=(a,b)=>Math.floor(Math.random()*(b-a+1))+a,shuffle=a=>[...a].sort(()=>Math.random()-.5);
let hero,platforms,books,stars,enemies,flag,door,camera=0,keys={},paused=false,last=0,t=0,particles=[],toastTimer=0,spawn={x:60,y:380},hurtTimer=0,worldWidth=3000;
const rect=(a,b)=>a.x<b.x+b.w&&a.x+a.w>b.x&&a.y<b.y+b.h&&a.y+a.h>b.y;
function stage(){let base=progress.level;hero={x:60,y:370,w:35,h:48,vx:0,vy:0,grounded:false,face:1};spawn={x:60,y:370};camera=0;paused=false;hurtTimer=0;particles=[];platforms=[{x:0,y:490,w:worldWidth,h:60}];
const plan=[[180,400,160],[440,335,170],[730,390,170],[1040,330,170],[1350,400,170],[1660,340,175],[1980,395,175],[2300,330,170],[2580,390,170]];
plan.forEach(([x,y,w],i)=>platforms.push({x,y:y+(base===1&&i%3===1?18:0),w,h:19}));
books=[{x:515,y:282,w:42,h:50,done:false,id:0},{x:1430,y:347,w:42,h:50,done:false,id:1},{x:2365,y:277,w:42,h:50,done:false,id:2}];
stars=[];for(let i=0;i<29;i++){let x=150+i*93;let plat=platforms.slice(1).find(p=>x>p.x&&x<p.x+p.w);stars.push({x,y:plat?plat.y-65:435,r:12,done:false})}
enemies=[{x:840,y:450,w:38,h:40,min:740,max:1030,dir:1},{x:1740,y:450,w:38,h:40,min:1600,max:1940,dir:-1},{x:2500,y:450,w:38,h:40,min:2430,max:2740,dir:1}];
flag={x:1560,y:420,w:22,h:70,done:false};door={x:2875,y:408,w:70,h:82};$('overlay').classList.remove('active');hud();say('Sakupi zvjezdice, riješi 3 zadatka i pronađi vrata!')}
function hud(){$('world').textContent=`🌍 ${progress.level+1}/3 ${levels[progress.level].name}`;$('coins').textContent=`⭐ ${progress.stars}`;$('lives').textContent='❤️'.repeat(progress.lives);$('keys').textContent=`🗝️ ${books.filter(b=>b.done).length}/3`;$('checkpoint').textContent=flag.done?'🚩 Kontrolna točka':'🚩 Početak';save()}
function say(s){$('message').textContent=s;toastTimer=180}
function burst(x,y){for(let i=0;i<22;i++)particles.push({x,y,vx:(Math.random()-.5)*8,vy:(Math.random()-.8)*8,life:60})}
function ask(title,question,options,answer,onWin,note=''){paused=true;keys={};$('overlay').classList.add('active');$('title').textContent=title;$('question').textContent=question;$('feedback').textContent='';$('note').textContent=note;let area=$('answers');area.replaceChildren();options.forEach(option=>{let b=document.createElement('button');b.textContent=option;b.onclick=()=>{if(option===answer){$('feedback').textContent='🎉 Bravo, točno!';area.querySelectorAll('button').forEach(x=>x.disabled=true);setTimeout(()=>{$('overlay').classList.remove('active');paused=false;onWin();hud()},550)}else{b.disabled=true;$('feedback').textContent='Pokušaj ponovno! 💛'}};area.append(b)})}
function bookChallenge(b){let kind=(b.id+progress.level)%3;if(kind===0){let word=words[(progress.level*5+b.id*3+R(0,4))%words.length],pos=R(0,word.length-1),answer=word[pos],opts=shuffle([answer,...shuffle('ABCČĆDĐEFGHIJKLMNOPRSŠTUVZŽ'.split('').filter(x=>x!==answer)).slice(0,3)]);ask('📚 Nedostaje slovo',word.slice(0,pos)+' _ '+word.slice(pos+1),opts,answer,()=>complete(b),'Odaberi slovo koje nedostaje.')}else if(kind===1){let word=words[(progress.level*7+b.id*5+R(0,3))%words.length];let pool=shuffle(words.filter(w=>w!==word&&Math.abs(w.length-word.length)<=1)).slice(0,3);ask('🔤 Pročitaj riječ',word.split('').join(' · '),shuffle([word,...pool]),word,()=>complete(b),'Koja je to riječ?')}else{let a=R(1,9),bb=R(1,9),minus=Math.random()<.5;if(minus&&bb>a)[a,bb]=[bb,a];if(!minus&&a+bb>10)bb=10-a;let ans=minus?a-bb:a+bb;let opts=new Set([String(ans)]);while(opts.size<4)opts.add(String(R(0,10)));ask('🔢 Matematički ključ',`${a} ${minus?'−':'+'} ${bb} = ?`,shuffle([...opts]),String(ans),()=>complete(b))}}
function complete(b){b.done=true;progress.stars+=20;burst(b.x,b.y);say('🗝️ Osvojen ključ! +20 zvjezdica')}
function damage(){if(hurtTimer>0||paused)return;progress.lives--;hurtTimer=100;hud();if(progress.lives<=0){ask('💖 Pokušaj ponovno','Vratimo se na početak razine!',['NASTAVI'],'NASTAVI',()=>{progress.lives=3;stage()})}else{hero.x=spawn.x;hero.y=spawn.y;hero.vx=0;hero.vy=0;say('Ups! Vrati se i pokušaj ponovno.')}}
function next(){if(books.some(b=>!b.done)){say('🔒 Trebaš riješiti sve tri knjige!');hero.x=door.x-100;hero.vx=-3;return}if(progress.level===2){ask('🏆 Velika pobjeda!','Osvojio/la si sva tri svijeta!',['IGRAJ OPET'],'IGRAJ OPET',()=>{progress={level:0,stars:0,lives:3};stage()})}else{ask('🚪 Novi svijet!','Sva tri ključa su tu. Bravo!',['NASTAVI'],'NASTAVI',()=>{progress.level++;progress.lives=3;stage()})}}
function physics(dt){let dir=(keys.right?1:0)-(keys.left?1:0);hero.vx=dir*4.4;if(dir)hero.face=dir;if(keys.jump&&hero.grounded){hero.vy=-12.8;hero.grounded=false;keys.jump=false}
let oldY=hero.y;hero.x=Math.max(0,Math.min(worldWidth-hero.w,hero.x+hero.vx*dt));hero.vy=Math.min(17,hero.vy+.62*dt);hero.y+=hero.vy*dt;hero.grounded=false;
for(let p of platforms){if(hero.x+hero.w>p.x+4&&hero.x<p.x+p.w-4&&oldY+hero.h<=p.y+7&&hero.y+hero.h>=p.y&&hero.vy>=0){hero.y=p.y-hero.h;hero.vy=0;hero.grounded=true}}
if(hero.y>H+100)damage();
for(let s of stars){if(!s.done&&Math.hypot(hero.x+hero.w/2-s.x,hero.y+hero.h/2-s.y)<35){s.done=true;progress.stars+=2;burst(s.x,s.y);hud()}}
for(let b of books){if(!b.done&&rect(hero,b)){bookChallenge(b);return}}
if(!flag.done&&rect(hero,flag)){flag.done=true;spawn={x:flag.x+20,y:360};say('🚩 Kontrolna točka spremljena!');hud()}
for(let e of enemies){e.x+=e.dir*(1.25+progress.level*.35)*dt;if(e.x<e.min||e.x>e.max)e.dir*=-1;if(rect(hero,e)){damage();break}}
if(rect(hero,door))next();
if(hurtTimer>0)hurtTimer-=dt;camera=Math.max(0,Math.min(worldWidth-W,hero.x-W*.36))}
function draw(){t++;let theme=levels[progress.level],sky=g.createLinearGradient(0,0,0,H);sky.addColorStop(0,theme.sky[0]);sky.addColorStop(1,theme.sky[1]);g.fillStyle=sky;g.fillRect(0,0,W,H);
g.fillStyle='#fff6ad';g.beginPath();g.arc(845,88,43,0,Math.PI*2);g.fill();
for(let i=0;i<12;i++){let x=((i*260-camera*.18)%(W+280)+W+280)%(W+280)-100,y=75+(i%3)*55;g.fillStyle='#ffffffb8';for(let j=0;j<3;j++){g.beginPath();g.ellipse(x+j*23,y+(j%2)*-10,31,18,0,0,7);g.fill()}}
for(let i=0;i<24;i++){let x=i*155-camera*.4;g.fillStyle=theme.hill;g.beginPath();g.moveTo(x-85,490);g.quadraticCurveTo(x+20,210+(i%3)*40,x+125,490);g.fill()}
g.save();g.translate(-camera,0);
for(let p of platforms){g.fillStyle='#76513e';g.fillRect(p.x,p.y,p.w,p.h);g.fillStyle=theme.ground;g.fillRect(p.x,p.y,p.w,9);for(let x=p.x+10;x<p.x+p.w;x+=28){g.fillStyle='#ffffff35';g.fillRect(x,p.y+11,7,3)}}
for(let s of stars){if(s.done)continue;g.save();g.translate(s.x,s.y+Math.sin(t*.07+s.x)*4);g.fillStyle='#ffe15b';g.beginPath();for(let k=0;k<10;k++){let a=k*Math.PI/5-Math.PI/2,r=k%2?6:15;g.lineTo(Math.cos(a)*r,Math.sin(a)*r)}g.closePath();g.fill();g.restore()}
for(let b of books){if(b.done)continue;g.save();g.translate(b.x,b.y+Math.sin(t*.055+b.id)*4);g.fillStyle='#fff8dd';g.strokeStyle='#5b68b2';g.lineWidth=4;g.beginPath();g.roundRect(0,0,b.w,b.h,5);g.fill();g.stroke();g.fillStyle='#5864a8';g.font='bold 27px system-ui';g.textAlign='center';g.fillText('?',21,34);g.restore()}
g.fillStyle='#5a4b80';g.fillRect(flag.x,flag.y,6,70);g.fillStyle=flag.done?'#ffd95a':'#ff82a2';g.beginPath();g.moveTo(flag.x+6,flag.y);g.lineTo(flag.x+55,flag.y+17);g.lineTo(flag.x+6,flag.y+35);g.fill();
g.fillStyle='#7354a6';g.beginPath();g.roundRect(door.x,door.y,door.w,door.h,[30,30,4,4]);g.fill();g.fillStyle='#e4bfff';g.beginPath();g.roundRect(door.x+12,door.y+14,46,68,[24,24,3,3]);g.fill();g.fillStyle='#fff1a0';g.beginPath();g.arc(door.x+50,door.y+53,5,0,7);g.fill();
for(let e of enemies){g.save();g.translate(e.x,e.y+Math.sin(t*.09)*3);g.fillStyle='#9a69ce';g.beginPath();g.ellipse(19,23,20,19,0,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(11,16,6,0,7);g.arc(27,16,6,0,7);g.fill();g.fillStyle='#233';g.beginPath();g.arc(12,16,3,0,7);g.arc(28,16,3,0,7);g.fill();g.restore()}
g.save();g.translate(hero.x+hero.w/2,hero.y+hero.h/2);if(hurtTimer>0&&t%8<4)g.globalAlpha=.4;g.scale(hero.face,1);
g.fillStyle='#b5bac2';g.beginPath();g.ellipse(-11,-30,8,29,-.17,0,7);g.ellipse(11,-30,8,29,.17,0,7);g.fill();g.fillStyle='#f6a6b8';g.beginPath();g.ellipse(-11,-30,4,20,-.17,0,7);g.ellipse(11,-30,4,20,.17,0,7);g.fill();g.fillStyle='#d2d6db';g.beginPath();g.ellipse(0,2,19,23,0,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(-7,-3,6,0,7);g.arc(7,-3,6,0,7);g.fill();g.fillStyle='#26384b';g.beginPath();g.arc(-6,-3,3,0,7);g.arc(8,-3,3,0,7);g.fill();g.fillStyle='#ef8ba3';g.beginPath();g.arc(1,8,4,0,7);g.fill();g.restore();
particles=particles.filter(p=>p.life-->0);for(let p of particles){p.x+=p.vx;p.y+=p.vy;p.vy+=.12;g.globalAlpha=p.life/60;g.fillStyle='#ffed85';g.fillRect(p.x,p.y,6,6)}g.globalAlpha=1;g.restore()}
function loop(now){let dt=Math.min(2,(now-last)/16.667||1);last=now;if(!paused)physics(dt);draw();requestAnimationFrame(loop)}
const mapping={ArrowLeft:'left',ArrowRight:'right',ArrowUp:'jump',a:'left',d:'right',w:'jump',' ':'jump'};
document.addEventListener('keydown',e=>{let key=mapping[e.key];if(key){e.preventDefault();keys[key]=true}});document.addEventListener('keyup',e=>{let key=mapping[e.key];if(key)keys[key]=false});window.addEventListener('blur',()=>keys={});
document.querySelectorAll('[data-key]').forEach(btn=>{let key=btn.dataset.key;btn.addEventListener('pointerdown',e=>{e.preventDefault();btn.setPointerCapture(e.pointerId);keys[key]=true});['pointerup','pointercancel','lostpointercapture'].forEach(ev=>btn.addEventListener(ev,()=>keys[key]=false))});
$('new').onclick=()=>{if(confirm('Pokrenuti novu igru i izbrisati napredak?')){progress={level:0,stars:0,lives:3};stage()}};
stage();requestAnimationFrame(loop);
})();</script></body></html>
